description: Superscript is a UK- and Netherlands-based business insurance provider offering
  flexible, subscription-based cover for small and growing businesses, sole traders, landlords,
  and larger enterprises. Its product range spans public and employers' liability, professional
  indemnity, cyber insurance, landlord insurance, and industry-specific policies, sold direct
  and through a broker channel. Superscript was surfaced as a portfolio company of Seedcamp and
  added to the API Evangelist network. As of this enrichment pass it publishes no public API,
  developer portal, or programmatic integration surface; this profile captures its public web
  identity and probed domain-security posture.
